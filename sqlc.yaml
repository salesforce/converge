version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "dbq"
        out: "internal/dbq"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "resource_phase"
            go_type:
              type: "ResourcePhase"
              import: ""
          # Per-column overrides so sqlc-generated structs are typed end-to-end.
          # We can't override "text" globally (it'd break Name fields) so we
          # match by table.column.
          - column: "resources.kind"
            go_type:
              import: "github.com/salesforce/converge/internal/model"
              package: "model"
              type: "Kind"
          # Override the nullable observed column so it serializes as raw
          # JSON (not base64). With the global db_type override, non-NULL
          # jsonb columns become json.RawMessage; sqlc falls back to []byte
          # for nullable ones, which encoding/json then base64-encodes when
          # the API returns the row. RawMessage's MarshalJSON treats a nil
          # value as JSON null, so this works fine for nullable columns too.
          - column: "resources.observed"
            go_type: "encoding/json.RawMessage"
