components:
  schemas:
    AccountSpec:
      additionalProperties: false
      properties:
        email:
          description: Root-account contact email.
          type: string
        team_name:
          description: Owner team name; appears in tags.
          minLength: 1
          type: string
      required:
        - team_name
        - email
      type: object
    AccountStatus:
      additionalProperties: false
      properties:
        account_id:
          description: Provider-issued 12-digit account id.
          type: string
      required:
        - account_id
      type: object
    ApplyKindConfigInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApplyKindConfigInputBody.json
          format: uri
          readOnly: true
          type: string
        max_inflight:
          description: Global in-flight cap across all pods; 0 = uncapped.
          format: int64
          minimum: 0
          type: integer
        max_transient_attempts:
          description: Consecutive transient reconcile failures before a task dead-letters (marked terminal); 0 = unbounded (retry forever).
          format: int64
          minimum: 0
          type: integer
        orphan_grace_seconds:
          description: Grace window in seconds before a composer-dropped child of this kind is torn down; 0 = prune immediately.
          format: int64
          minimum: 0
          type: integer
        resync_interval_seconds:
          description: Drift re-check interval in seconds; 0 = disabled.
          format: int64
          minimum: 0
          type: integer
        resync_recomposes:
          description: Whether a resync also re-runs the composer (only meaningful when resync is enabled).
          type: boolean
        retired:
          description: "RETIRE this web-API version: freeze NEW creates/flips onto it (422) while existing resources keep reconciling so they can drain/migrate off. Runtime-editable; effective values (not deltas), so send the current value to preserve it."
          type: boolean
        task_deadline_seconds:
          description: Per-task timeout in seconds; 0 = no deadline.
          format: int64
          minimum: 0
          type: integer
      required:
        - max_inflight
        - task_deadline_seconds
        - resync_interval_seconds
        - orphan_grace_seconds
        - max_transient_attempts
      type: object
    ApplyProviderConfigInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApplyProviderConfigInputBody.json
          format: uri
          readOnly: true
          type: string
        data:
          description: base64-encoded opaque provider bundle (e.g. a zip of Starlark .star files); decoded into the config's data bytes. Max 10 MiB decoded.
          type: string
        is_default:
          description: True = this (kind, version)'s single live-reconfigurable DEFAULT; false = a CUSTOM override referenced via provider_config_ref.
          type: boolean
        kind:
          description: Consumer kind this config parameterises.
          minLength: 1
          type: string
        kind_version:
          description: Consumer kind web-API version (v1, v2, …; 1–32767). REQUIRED — no implicit v1 default.
          format: int64
          maximum: 32767
          minimum: 1
          type: integer
        name:
          description: Global config name; provider_config_ref resolves by it.
          minLength: 1
          type: string
        spec:
          description: Config document; shape is the kind's config_schema (GET /api/kinds/{kind}/schema).
        type:
          description: Optional self-describing tag; must be "providerconfig" if set. Ignored for routing.
          enum:
            - providerconfig
          type: string
      required:
        - name
        - kind
        - kind_version
        - spec
      type: object
    ApplyReactorBindingInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApplyReactorBindingInputBody.json
          format: uri
          readOnly: true
          type: string
        enabled:
          description: Whether the subscription is active. Defaults true.
          type: boolean
        label_match:
          description: "Optional label predicate: {} (or omitted) matches all; else the resource's labels must contain these."
        name:
          description: Unique subscription name (operator-chosen; opaque).
          minLength: 1
          type: string
        reactor:
          description: Reactor kind whose reaction runs when the subscription fires (the broker ships STAGE_REACT to a worker advertising this kind). Must be a registered reactor kind, distinct from the watched kind.
          minLength: 1
          type: string
        reactor_version:
          description: "Optional: pin the reactor's web-API version (v1, v2, …). 0/omitted resolves the reactor's highest published version at claim time."
          format: int64
          minimum: 0
          type: integer
        transition:
          description: Lifecycle transition that fires the subscription.
          enum:
            - created
            - synced
            - degraded
            - failed
            - deleted
          type: string
        type:
          description: Optional self-describing tag; must be "reactorbinding" if set. Ignored for routing.
          enum:
            - reactorbinding
          type: string
        watch_kind:
          description: Resource kind to watch.
          minLength: 1
          type: string
        watch_kind_version:
          description: "Optional: fire only for this web-API version (v1, v2, …) of the watched kind. 0/omitted = all versions."
          format: int64
          minimum: 0
          type: integer
      required:
        - name
        - watch_kind
        - transition
        - reactor
      type: object
    ApplyResourceManifestInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ApplyResourceManifestInputBody.json
          format: uri
          readOnly: true
          type: string
        kind:
          description: Resource kind.
          type: string
        kind_version:
          description: Web-API version (v1, v2, …; 1–32767). REQUIRED — no implicit v1 default. A change from the resource's current kindVersion is a breaking flip.
          format: int64
          maximum: 32767
          minimum: 1
          type: integer
        labels:
          additionalProperties:
            type: string
          description: Full label set (string→string); applied wholesale — omitting a key removes it.
          type: object
        name:
          description: Resource name; identity together with kind.
          minLength: 1
          type: string
        provider_config_ref:
          description: Name of a providerconfig resource to attach as a per-resource config override.
          type: string
        spec:
          description: Per-kind desired-state spec.
        type:
          description: Optional self-describing tag; must be "resource" if set. Ignored for routing.
          enum:
            - resource
          type: string
      required:
        - kind
        - kind_version
        - name
        - spec
      type: object
    ChangesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChangesOutputBody.json
          format: uri
          readOnly: true
          type: string
        owner:
          $ref: "#/components/schemas/ResourceInfo"
        resources:
          items:
