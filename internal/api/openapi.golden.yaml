info:
  title: Converge API
  version: 2.0.0
openapi: 3.1.0
paths:
  /api/v1/cluster-members:
    get:
      operationId: get-api-v1-cluster-members
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterInfoOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get API v1 cluster members
  /api/v1/kinds:
    get:
      operationId: get-api-v1-kinds
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListKindsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get API v1 kinds
  /api/v1/kinds/manifests:
    get:
      operationId: get-api-v1-kinds-manifests
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListManifestsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
