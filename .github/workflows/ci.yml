name: ci

# The verify gate for every push to main and every pull request: it mirrors the
# local `just` checks a developer runs before committing (fmt/gen drift, build,
# lint, vuln, the integration suite) so nothing lands on main that the house
# workflow would reject. Nothing here publishes — releasing is a separate,
# tag-driven workflow (see release.yml + release-please.yml).
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run for the same ref when a newer commit arrives (a force-push
# or a quick follow-up) — the older run's result is already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast, Docker-free lane: formatting + generated-code drift, the build, the
  # linter, and the vulnerability scan. Runs in parallel with the integration job
  # so a lint failure surfaces without waiting on the (slower) testcontainer suite.
  verify:
    runs-on: salesforce-Ubuntu
    steps:
      - uses: actions/checkout@v4
      # go-version-file reads the `go` + `toolchain` lines from go.mod, so the CI
      # compiler tracks the pinned toolchain (currently go1.26.5 for the crypto/tls
      # CVE fix) automatically — no version to keep in sync here. cache:false because
      # the explicit cache step below is broader: setup-go's built-in cache keys on
      # go.sum only, but our dev tools are run via `go run <module>@<version>` and are
      # deliberately OFF go.mod (see the justfile header) — so a go.sum-keyed cache
      # never covers the tool download+compile. Our key adds `justfile` (where the tool
      # versions live) so the compiled tools are cached and reused across runs.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # One cache for BOTH the app's module/build cache AND the `go run @version` dev
      # tools (sqlc/buf/golangci-lint/oapi-codegen/goimports/govulncheck), which
      # otherwise re-download + recompile from source on every cold runner (the long
      # `go: downloading …` wall). Keyed on go.sum (app deps) + justfile (tool pins):
      # bump a tool version → key busts → tools recompile once; otherwise it's a hit.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: extractions/setup-just@v3
      # node is required by `just gen`/`just build`: both run `just ui`, which builds
      # the SPA that cmd/converge embeds via go:embed. cache: npm reuses the npm
      # download cache across runs, keyed on the three package-lock.json files.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            sdk-ts/package-lock.json
            examples/demos/typescript/package-lock.json

      # `just fmt` must be a no-op on a clean tree; a nonzero diff means someone
      # committed unformatted Go.
      - name: gofmt / imports drift
        run: |
          just fmt
          git diff --exit-code

      # `just gen` regenerates sqlc → internal/dbq, the protos, the openapi/schema
      # goldens, and the conctl client. A nonzero diff means generated code was not
      # regenerated after a query/proto/schema/API change. NB: `just golden` spins a
      # Postgres testcontainer for the schema golden, so this step needs Docker on the
      # runner.
      - name: generated-code drift (just gen)
        run: |
          just gen
          git diff --exit-code

      - name: build (converge + workers + conctl, embeds UI)
        run: just build

      - name: lint (golangci-lint)
        run: just lint

      # govulncheck with source-reachable analysis; exits nonzero on a reachable
      # vulnerability, so it doubles as the CI gate the CLAUDE.md security section
      # calls for. A new upstream CVE can turn this red without a code change — that
      # is intended; the fix is a toolchain/module bump.
      - name: vuln scan (govulncheck)
        run: just vuln

  # Integration lane: the FULL `just test` — the base ./test suite PLUS the
  # broker/worker chaos, control-plane HA, and streaming-replica soak. Runs on the
  # org-provided `salesforce-Ubuntu` runner, but SERIALLY (SERIAL=1): the runner is
  # ~2 vCPU, so the four phases running concurrently (each its OWN fleet + Postgres
  # testcontainer) starve each other and time out. One phase at a time gives each the
  # whole runner. The per-phase timeouts + chaos budget are raised via env (the recipe
  # reads TEST_TIMEOUT_*/CHAOS_BUDGET) because a slow runner is throughput-bound. The
  # suite needs Docker for the testcontainers, so a preflight fails fast with a clear
  # message if this runner has no Docker daemon (org runners don't always ship one).
  integration:
    runs-on: salesforce-Ubuntu
    env:
      SERIAL: "1"
      # Roomier than the dev-box defaults (600s/15m/15m/10m, 8m budget) for the slow
      # runner. Serial, so wall-clock is the SUM — the outer timeout below covers it.
      TEST_TIMEOUT_BASE: "30m"
      TEST_TIMEOUT_CHAOS: "20m"
      TEST_TIMEOUT_HA: "20m"
      TEST_TIMEOUT_REPL: "15m"
      CHAOS_BUDGET: "12m"
      # Disable Ryuk — the testcontainers reaper sidecar. Ryuk needs a privileged
      # socket + a host callback port and is the classic hang on locked-down org /
      # self-hosted runners; a base-suite run that timed out at the FULL 30m (not slow,
      # WEDGED on pgxpool.Acquire) points straight at it. The runner VM is torn down
      # after the job, so leftover containers don't matter — Ryuk buys nothing here.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    # Outer backstop above the SUM of the serial per-phase timeouts (30+20+20+15 = 85m)
    # plus a cold image pull, in case a phase wedges rather than failing cleanly.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Preflight: isolate WHERE Postgres testcontainers break on this runner, in four
      # separately-timed stages, so a hang is attributed to the exact cause instead of
      # wedging the 30m suite. The stages mirror what the Go harness's postgres.Run does:
      #   1. daemon reachable   2. image PULL (the prime suspect — a blocked/rate-limited
      #   Docker Hub on a corporate runner hangs here, which is ALSO why the real suite
      #   wedged on pgxpool.Acquire: the image never pulls, so the DB never starts)
      #   3. container starts   4. the HOST-mapped port is reachable (networking).
      - name: preflight — Docker + testcontainer networking
        timeout-minutes: 5
        run: |
          set -u
          if ! docker info >/dev/null 2>&1; then
            echo "::error::No reachable Docker daemon."
            exit 1
          fi
          docker version

          echo "── stage 2: pull postgres:16-alpine (120s cap) — the suite pulls the same image ──"
          if ! timeout 120 docker pull postgres:16-alpine; then
            echo "::error::docker pull of postgres:16-alpine failed or timed out — this runner likely cannot reach Docker Hub (firewall / rate limit). The real suite wedges for the same reason. Fix: a registry mirror, or pre-pull the image onto the runner, or point the harness image at an internal mirror."
            echo "── registry reachability probe ──"
            timeout 15 docker pull hello-world && echo "hello-world pulled OK (so postgres/tag specifically is the issue)" || echo "even hello-world failed → Docker Hub is unreachable from this runner"
            exit 1
          fi
          echo "pull OK"

          echo "── stage 3: start the container ──"
          cid=$(docker run -d -e POSTGRES_PASSWORD=probe -P postgres:16-alpine)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          hostport=$(docker port "$cid" 5432/tcp | head -1)
          echo "container 5432 mapped to: $hostport"

          echo "── stage 4: probe the host-mapped port (the exact thing pgxpool does) ──"
          ok=0
          for i in $(seq 1 30); do
            if docker exec "$cid" pg_isready -U postgres >/dev/null 2>&1; then echo "pg_isready ok after ${i}s"; ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "::error::postgres never became ready inside the container"; docker logs "$cid" | tail -20; exit 1; }
          if (exec 3<>"/dev/tcp/${hostport%:*}/${hostport##*:}") 2>/dev/null; then
            echo "host TCP connect to mapped port OK — testcontainer networking works"
          else
            echo "::error::mapped port unreachable from host — testcontainer networking is broken (container-in-container / socket)."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Same tool+deps cache as the verify job (see its comment). A distinct key
      # namespace ('test' vs 'go') so the two jobs don't overwrite each other's entry —
      # this job also caches the compiled ./test tree, verify caches the tool binaries.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ hashFiles('go.sum', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-go-test-
            ${{ runner.os }}-go-
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            sdk-ts/package-lock.json
            examples/demos/typescript/package-lock.json

      - name: full integration suite (base + chaos + HA + replica)
        run: just test
