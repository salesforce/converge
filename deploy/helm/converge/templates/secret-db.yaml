{{- /*
DB DSN Secret — created ONLY when the user did not point at an existing Secret.
Holds the writer DSN (database-url) and, if configured inline, the reader DSN
(database-read-url). For prod, prefer database.existingSecret (managed out of band)
so the DSN never lands in the release's rendered manifests / Helm history.
*/ -}}
{{- if not .Values.database.existingSecret.name }}
{{- if not .Values.database.url }}
{{- fail "converge: set database.url or database.existingSecret.name — control+broker pods need a writer DSN (with database.iamAuth=true the DSN's password is ignored and replaced by a minted IAM token, but the host/db/user/sslmode are still required)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "converge.dbSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "converge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if .Values.database.readUrl }}
  database-read-url: {{ .Values.database.readUrl | quote }}
  {{- end }}
{{- end }}
