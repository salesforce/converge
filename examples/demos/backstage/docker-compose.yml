# End-to-end Backstage golden-path demo, fully containerized.
#
# Brings up the whole stack: Postgres → migrate (one-shot) → a Converge control pod + a
# broker pod + a classic-worker (the classicbom composer + account/vpc/tgw/route leaf
# providers + statussink reactor) → a one-shot `seed` that applies the CRDs + reactor
# wiring via conctl → a real Backstage instance with the `converge:apply` custom action
# baked in.
#
# A developer opens Backstage at http://localhost:3000, runs the "Provision a deployment"
# template, and watches the classicbom root compose + roll up in the Converge UI at
# http://localhost:8080.
#
# Single broker on purpose: with one broker there is no broker↔broker mesh to configure
# (RELAY_ADVERTISE_ADDR/MESH_*), so the topology is minimal and reliable. h2c (plain HTTP,
# no mTLS) between worker and broker — this is a local demo, not a security showcase.
#
# Build the images first (from the repo root):
#   just backstage-images           # or see the justfile `images` recipe in this dir
#
# Then:  docker compose -f examples/demos/backstage/docker-compose.yml up

name: converge-backstage-demo

services:
  # ── Postgres: the substrate. ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: converge
      POSTGRES_PASSWORD: converge
      POSTGRES_DB: converge
    # Exposed for debugging (conctl/psql from the host); the stack talks over the compose net.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converge -d converge"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      # Ephemeral demo DB — no volume, so `down` is a clean slate.
      - /var/lib/postgresql/data

  # ── migrate: one-shot, runs the advisory-locked schema migration, then exits 0. ──
  # Every pod runs migrations at boot anyway (advisory-locked), but running it explicitly
  # first gives the control/broker a migrated DB to start against with no race.
  migrate:
    image: converge:demo
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://converge:converge@postgres:5432/converge?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── control: sweepers + REST API + embedded UI (http://localhost:8080). ──
  control:
    image: converge:demo
    environment:
      ROLE: control
      DATABASE_URL: postgres://converge:converge@postgres:5432/converge?sslmode=disable
      LISTEN_ADDR: ":8080"
      LOG_FORMAT: json
      # CORS: let the Backstage frontend (localhost:3000) call the control API directly if
      # ever needed. The scaffolder action calls server-side, but this keeps the UI open.
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/livez || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ── broker: owns the work_queue tiles, serves the WorkerService over Connect (h2c). ──
  broker:
    image: converge:demo
    environment:
      ROLE: broker
      DATABASE_URL: postgres://converge:converge@postgres:5432/converge?sslmode=disable
      BROKER_ADDR_LISTEN: ":9090"
      HEALTH_ADDR: ":8081"
      LOG_FORMAT: json
    ports:
      - "9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/livez || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ── classic-worker: the dumb worker hosting the classicbom composer + leaf providers. ──
  # Dials the broker over h2c (BROKER_ADDR). No DATABASE_URL — workers never touch the DB.
  worker:
    image: classic-worker:demo
    environment:
      BROKER_ADDR: http://broker:9090
      WORKER_MAX_PARALLEL: "16"
      HEALTH_ADDR: ":8082"
      LOG_FORMAT: json
    depends_on:
      broker:
        condition: service_healthy
    # 3 workers so the composer + leaves have ample parallelism (single broker, so all land
    # on it — no shard-tile-without-worker concern that a multi-broker fleet has).
    deploy:
      replicas: 3

  # ── seed: one-shot. Applies the CRDs (classicbom + account/vpc/tgw/route + statussink)
  #    and the statussink reactor binding via conctl, then exits. This is the out-of-band
  #    "operator sets up kinds" step; Backstage only applies the RESOURCE afterward. ──
  seed:
    image: converge:demo
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      CONVERGE_SERVER: http://control:8080
    volumes:
      # Mount the classic demo's fixtures (the classicbom/account/vpc/tgw/route/statussink
      # CRDs + reactor wiring) + the seed script read-only into the container.
      - ../classic/testfixtures:/fixtures/classic:ro
      - ./seed.sh:/seed/seed.sh:ro
    depends_on:
      control:
        condition: service_healthy
    restart: "no"

  # ── backstage: a real Backstage 1.53 app with the converge:apply action + golden-path
  #    template baked in and pre-wired (see Dockerfile.backstage). Native modules compile
  #    INSIDE the image (node:22), so nothing is wired or built by hand. `yarn start` runs the
  #    frontend (:3000, the browser UI, bound 0.0.0.0) + the backend (:7007). Open
  #    http://localhost:3000 → Create → "Provision a deployment". ──
  backstage:
    build:
      context: .
      dockerfile: Dockerfile.backstage
    environment:
      # Where the converge:apply action POSTs. Inside the compose net the control API is
      # reachable as http://control:8080 (read by the action via converge.baseUrl).
      CONVERGE_BASE_URL: http://control:8080
    ports:
      - "3000:3000"   # frontend (browser UI)
      - "7007:7007"   # backend API (the frontend proxies to it)
    depends_on:
      seed:
        condition: service_completed_successfully
